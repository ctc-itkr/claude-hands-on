<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <rect x="0" y="0" width="1000" height="690" fill="#faf8f3"/>
  <!-- title -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#241f17">XBRLの構成 ── タクソノミ（辞書・型） × インスタンス（実データ）</text>
  <text x="40" y="64" font-size="13" fill="#6a6353">「勘定科目マスタ（タクソノミ）に沿って今期の数値（インスタンス）を記録したもの」がXBRL</text>

  <!-- ===== TAXONOMY BOX ===== -->
  <rect x="40" y="88" width="430" height="228" rx="12" fill="#eef1f4" stroke="#cdd5dd" stroke-width="1.5"/>
  <rect x="40" y="88" width="430" height="34" rx="12" fill="#3a4653"/>
  <rect x="40" y="104" width="430" height="18" fill="#3a4653"/>
  <text x="60" y="111" font-size="15" font-weight="700" fill="#ffffff">タクソノミ（辞書・型）</text>
  <text x="452" y="111" font-size="11" fill="#c9d2db" text-anchor="end">どう読むか</text>

  <g font-size="12.5">
    <rect x="60" y="136" width="72" height="22" rx="5" fill="#dbe3ea" stroke="#b9c4ce"/>
    <text x="96" y="151" text-anchor="middle" font-family="monospace" fill="#2c3742">.xsd</text>
    <text x="144" y="151" fill="#2c3742">スキーマ ｜ 要素（項目）の定義・型</text>

    <rect x="60" y="168" width="72" height="22" rx="5" fill="#dbe3ea" stroke="#b9c4ce"/>
    <text x="96" y="183" text-anchor="middle" font-family="monospace" fill="#2c3742">_pre</text>
    <text x="144" y="183" fill="#2c3742">表示リンクベース ｜ 並び順・階層</text>

    <rect x="60" y="200" width="72" height="22" rx="5" fill="#dbe3ea" stroke="#b9c4ce"/>
    <text x="96" y="215" text-anchor="middle" font-family="monospace" fill="#2c3742">_cal</text>
    <text x="144" y="215" fill="#2c3742">計算リンクベース ｜ 合計＝内訳の加算</text>

    <rect x="60" y="232" width="72" height="22" rx="5" fill="#dbe3ea" stroke="#b9c4ce"/>
    <text x="96" y="247" text-anchor="middle" font-family="monospace" fill="#2c3742">_def</text>
    <text x="144" y="247" fill="#2c3742">定義リンクベース ｜ 軸（ディメンション）</text>

    <rect x="60" y="264" width="72" height="22" rx="5" fill="#dbe3ea" stroke="#b9c4ce"/>
    <text x="96" y="279" text-anchor="middle" font-family="monospace" fill="#2c3742">_lab</text>
    <text x="144" y="279" fill="#2c3742">ラベルリンクベース ｜ 日本語/英語名</text>
  </g>

  <!-- ===== INSTANCE BOX ===== -->
  <rect x="530" y="88" width="430" height="228" rx="12" fill="#f6efe0" stroke="#e0cfa6" stroke-width="1.5"/>
  <rect x="530" y="88" width="430" height="34" rx="12" fill="#9a6a12"/>
  <rect x="530" y="104" width="430" height="18" fill="#9a6a12"/>
  <text x="550" y="111" font-size="15" font-weight="700" fill="#ffffff">インスタンス（.xbrl）</text>
  <text x="942" y="111" font-size="11" fill="#f0e2c2" text-anchor="end">何がいくつか＝実データ</text>

  <g font-size="12.5">
    <rect x="550" y="140" width="96" height="22" rx="5" fill="#ecdcbb" stroke="#d8c199"/>
    <text x="598" y="155" text-anchor="middle" fill="#6b4a10">ファクト</text>
    <text x="658" y="155" fill="#4a3a20">値そのもの（多数）</text>

    <rect x="550" y="176" width="96" height="22" rx="5" fill="#ecdcbb" stroke="#d8c199"/>
    <text x="598" y="191" text-anchor="middle" fill="#6b4a10">コンテキスト</text>
    <text x="658" y="191" fill="#4a3a20">いつ・連結/個別</text>

    <rect x="550" y="212" width="96" height="22" rx="5" fill="#ecdcbb" stroke="#d8c199"/>
    <text x="598" y="227" text-anchor="middle" fill="#6b4a10">ユニット</text>
    <text x="658" y="227" fill="#4a3a20">単位（円・株・％）</text>

    <rect x="550" y="248" width="96" height="22" rx="5" fill="#ecdcbb" stroke="#d8c199"/>
    <text x="598" y="263" text-anchor="middle" fill="#6b4a10">DEI</text>
    <text x="658" y="263" fill="#4a3a20">会社情報・会計基準（IFRS/日本基準）</text>
  </g>

  <!-- reference arrow instance -> taxonomy -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6a12"/>
    </marker>
  </defs>
  <line x1="548" y1="150" x2="474" y2="150" stroke="#9a6a12" stroke-width="2" marker-end="url(#ah)"/>
  <text x="511" y="142" font-size="10.5" fill="#9a6a12" text-anchor="middle" font-weight="600">参照</text>
  <text x="511" y="172" font-size="9.5" fill="#8a7a5c" text-anchor="middle">各ファクトは</text>
  <text x="511" y="184" font-size="9.5" fill="#8a7a5c" text-anchor="middle">要素定義を指す</text>

  <!-- ===== FACT ANATOMY ===== -->
  <text x="40" y="360" font-size="16" font-weight="700" fill="#241f17">1ファクトの分解（ＡＲＥホールディングス 実例）</text>

  <rect x="40" y="374" width="920" height="72" rx="8" fill="#20221f"/>
  <text x="60" y="404" font-family="monospace" font-size="14">
    <tspan fill="#e6e2d8">&lt;</tspan><tspan fill="#d8ab4f" font-weight="700">jpcrp_cor:RevenueIFRSSummaryOfBusinessResults</tspan>
  </text>
  <text x="60" y="428" font-family="monospace" font-size="14">
    <tspan fill="#e6e2d8">  </tspan><tspan fill="#6fc0bd">contextRef="CurrentYearDuration"</tspan><tspan fill="#e6e2d8"> </tspan><tspan fill="#b39ce0">unitRef="JPY"</tspan><tspan fill="#e6e2d8">&gt;</tspan><tspan fill="#7ecb9a" font-weight="700">569992000000</tspan><tspan fill="#e6e2d8">&lt;/…&gt;</tspan>
  </text>

  <!-- four cards -->
  <g font-size="12">
    <!-- element -->
    <rect x="40" y="470" width="220" height="196" rx="9" fill="#ffffff" stroke="#e6ddc9" stroke-width="1.5"/>
    <rect x="40" y="470" width="220" height="6" rx="3" fill="#d8ab4f"/>
    <text x="56" y="498" font-size="13.5" font-weight="700" fill="#8a6410">要素（コンセプト）</text>
    <text x="56" y="518" fill="#6a6353">何の項目か</text>
    <text x="56" y="540" font-size="11" font-family="monospace" fill="#3a352a">Revenue…</text>
    <text x="56" y="556" font-size="11" font-family="monospace" fill="#3a352a">SummaryOf</text>
    <text x="56" y="572" font-size="11" font-family="monospace" fill="#3a352a">BusinessResults</text>
    <text x="56" y="596" fill="#241f17" font-weight="600">＝ IFRS売上収益</text>
    <text x="56" y="616" font-size="10.5" fill="#94886f">（経営指標等）</text>
    <text x="56" y="646" font-size="10.5" fill="#94886f">名前空間 jpcrp_cor で</text>
    <text x="56" y="660" font-size="10.5" fill="#94886f">辞書上の定義に紐づく</text>

    <!-- context -->
    <rect x="272" y="470" width="220" height="196" rx="9" fill="#ffffff" stroke="#e6ddc9" stroke-width="1.5"/>
    <rect x="272" y="470" width="220" height="6" rx="3" fill="#2f8f8a"/>
    <text x="288" y="498" font-size="13.5" font-weight="700" fill="#1f6b67">コンテキスト</text>
    <text x="288" y="518" fill="#6a6353">いつ・連結/個別</text>
    <text x="288" y="540" font-size="11" font-family="monospace" fill="#3a352a">CurrentYear</text>
    <text x="288" y="556" font-size="11" font-family="monospace" fill="#3a352a">Duration</text>
    <text x="288" y="582" fill="#241f17" font-weight="600">＝ 当期（期間）</text>
    <text x="288" y="602" font-size="10.5" fill="#94886f">2025/4–2026/3・連結</text>
    <text x="288" y="632" font-size="10.5" fill="#94886f">Instant=時点／</text>
    <text x="288" y="646" font-size="10.5" fill="#94886f">Prior1Year=前期／</text>
    <text x="288" y="660" font-size="10.5" fill="#94886f">_NonConsolidated=個別</text>

    <!-- unit -->
    <rect x="504" y="470" width="220" height="196" rx="9" fill="#ffffff" stroke="#e6ddc9" stroke-width="1.5"/>
    <rect x="504" y="470" width="220" height="6" rx="3" fill="#7a5fc0"/>
    <text x="520" y="498" font-size="13.5" font-weight="700" fill="#5a44a0">ユニット</text>
    <text x="520" y="518" fill="#6a6353">単位</text>
    <text x="520" y="540" font-size="11" font-family="monospace" fill="#3a352a">JPY</text>
    <text x="520" y="564" fill="#241f17" font-weight="600">＝ 円</text>
    <text x="520" y="592" font-size="10.5" fill="#94886f">ほかに pure（比率・株数）</text>
    <text x="520" y="606" font-size="10.5" fill="#94886f">JPYPerShares（円/株）</text>

    <!-- value -->
    <rect x="736" y="470" width="224" height="196" rx="9" fill="#ffffff" stroke="#e6ddc9" stroke-width="1.5"/>
    <rect x="736" y="470" width="224" height="6" rx="3" fill="#2f9d63"/>
    <text x="752" y="498" font-size="13.5" font-weight="700" fill="#1f7d4a">値（ファクト本体）</text>
    <text x="752" y="518" fill="#6a6353">数値そのもの</text>
    <text x="752" y="542" font-size="12.5" font-family="monospace" fill="#3a352a">569992000000</text>
    <text x="752" y="568" fill="#241f17" font-weight="600">＝ 5,699.92 億円</text>
    <text x="752" y="596" font-size="10.5" fill="#94886f">decimals="-6" は</text>
    <text x="752" y="610" font-size="10.5" fill="#94886f">百万円未満を丸める意</text>
    <text x="752" y="640" font-size="10.5" fill="#94886f">値は円単位で格納。</text>
    <text x="752" y="654" font-size="10.5" fill="#94886f">表示時に÷1億</text>
  </g>
</svg>
