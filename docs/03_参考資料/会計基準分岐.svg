<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<style>
.bg{fill:#fff}.card{fill:#ffffff;stroke:#e7dece;stroke-width:1.5}.ifrs{fill:#eaf1ff;stroke:#2f6df6;stroke-width:1.5}.jp{fill:#f6eedd;stroke:#a97c37;stroke-width:1.5}.goal{fill:#f2efe9;stroke:#232830;stroke-width:1.5}
.t{fill:#232830}.sub{fill:#6f7683}.arw{stroke:#2f6df6;stroke-width:2;fill:none;marker-end:url(#a)}
@media (prefers-color-scheme:dark){.bg{fill:#0b1220}.card{fill:#1c1e22;stroke:#3a3f47}.ifrs{fill:#12233f;stroke:#8fb4ff}.jp{fill:#3a2e17;stroke:#d8b26a}.goal{fill:#2a2e33;stroke:#c9cdd4}.t{fill:#e2e8f0}.sub{fill:#94a3b8}.arw{stroke:#6f9dff}}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2f6df6"/></marker></defs>
<rect class="bg" width="880" height="300"/>
<rect class="card" x="20" y="120" width="130" height="60" rx="8"/>
<text class="t" x="85" y="146" text-anchor="middle" font-size="13" font-weight="bold">有価証券報告書</text><text class="t" x="85" y="165" text-anchor="middle" font-size="13">XBRL</text>
<rect class="card" x="200" y="112" width="190" height="76" rx="8"/>
<text class="t" x="295" y="140" text-anchor="middle" font-size="13" font-weight="bold">基準を自動判定</text>
<text class="sub" x="295" y="163" text-anchor="middle" font-size="12">AccountingStandardsDEI</text>
<rect class="ifrs" x="440" y="45" width="220" height="60" rx="8"/>
<text class="t" x="550" y="70" text-anchor="middle" font-size="13" font-weight="bold">IFRS</text>
<text class="sub" x="550" y="91" text-anchor="middle" font-size="12">RevenueIFRS… / 税引前利益…</text>
<rect class="jp" x="440" y="195" width="220" height="60" rx="8"/>
<text class="t" x="550" y="220" text-anchor="middle" font-size="13" font-weight="bold">日本基準</text>
<text class="sub" x="550" y="241" text-anchor="middle" font-size="12">NetSales… / 経常利益…</text>
<rect class="goal" x="710" y="118" width="150" height="64" rx="8"/>
<text class="t" x="785" y="145" text-anchor="middle" font-size="13" font-weight="bold">同じ</text>
<text class="t" x="785" y="166" text-anchor="middle" font-size="13" font-weight="bold">ダッシュボード</text>
<path class="arw" d="M150,150 L196,150"/>
<path class="arw" d="M392,140 L438,90"/>
<path class="arw" d="M392,160 L438,215"/>
<path class="arw" d="M660,80 L706,135"/>
<path class="arw" d="M660,220 L706,165"/>
<text class="sub" x="440" y="290" text-anchor="middle" font-size="12">同じ入口・同じ操作。基準ごとの分岐はスキルが引き受ける</text>
</svg>
