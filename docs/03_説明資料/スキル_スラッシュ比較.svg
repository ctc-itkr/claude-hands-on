<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<style>
.bg{fill:#fff}.a{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}.b{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
.t{fill:#0f172a}.sub{fill:#475569}.k{fill:#64748b}.mono{fill:#2563eb}
@media (prefers-color-scheme:dark){.bg{fill:#0b1220}.a{fill:#312e81;stroke:#a5b4fc}.b{fill:#7f1d1d;stroke:#fca5a5}.t{fill:#e2e8f0}.sub{fill:#cbd5e1}.k{fill:#94a3b8}.mono{fill:#60a5fa}}
</style>
<rect class="bg" width="740" height="270"/>
<rect class="a" x="30" y="30" width="320" height="200" rx="10"/>
<rect class="b" x="390" y="30" width="320" height="200" rx="10"/>
<text class="t" x="190" y="62" text-anchor="middle" font-size="16" font-weight="bold">スキル</text>
<text class="t" x="550" y="62" text-anchor="middle" font-size="16" font-weight="bold">スラッシュコマンド</text>
<text class="k" x="50" y="100" font-size="12">起動</text><text class="sub" x="150" y="100" font-size="13">自動で発動（Claudeが判断）</text>
<text class="k" x="410" y="100" font-size="12">起動</text><text class="sub" x="510" y="100" font-size="13">手動（/名前）</text>
<text class="k" x="50" y="135" font-size="12">中身</text><text class="sub" x="150" y="135" font-size="13">手順書＋道具</text>
<text class="k" x="410" y="135" font-size="12">中身</text><text class="sub" x="510" y="135" font-size="13">定型プロンプト</text>
<text class="k" x="50" y="170" font-size="12">場所</text><text class="mono" x="150" y="170" font-size="12">skills/&lt;名前&gt;/SKILL.md</text>
<text class="k" x="410" y="170" font-size="12">場所</text><text class="mono" x="510" y="170" font-size="12">.claude/commands/&lt;名前&gt;.md</text>
<text class="sub" x="190" y="208" text-anchor="middle" font-size="12">必要なとき自分で取り出す能力</text>
<text class="sub" x="550" y="208" text-anchor="middle" font-size="12">人が打つ定型指示</text>
<text class="k" x="370" y="262" text-anchor="middle" font-size="12">/ で起動 → 中でスキルが動く（組み合わせ可）</text>
</svg>
