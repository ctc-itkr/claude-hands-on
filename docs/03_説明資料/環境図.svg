<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<style>
.bg{fill:#fff}.card{fill:#f1f5f9;stroke:#334155;stroke-width:1.5}.brain{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
.t{fill:#0f172a}.sub{fill:#475569}.acc{fill:#2563eb}.arw{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}
@media (prefers-color-scheme:dark){.bg{fill:#0b1220}.card{fill:#1e293b;stroke:#94a3b8}.brain{fill:#312e81;stroke:#a5b4fc}.t{fill:#e2e8f0}.sub{fill:#94a3b8}.acc{fill:#60a5fa}.arw{stroke:#60a5fa}}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect class="bg" width="760" height="250"/>
<rect class="card" x="30" y="60" width="300" height="120" rx="10"/>
<text class="t" x="180" y="94" text-anchor="middle" font-size="15" font-weight="bold">手元PC（デスクトップアプリ）</text>
<text class="t" x="180" y="118" text-anchor="middle" font-size="14">Claude Code</text>
<text class="sub" x="180" y="150" text-anchor="middle" font-size="12">ファイル操作・コマンド実行＝「やって」</text>
<rect class="brain" x="430" y="60" width="300" height="120" rx="10"/>
<text class="t" x="580" y="94" text-anchor="middle" font-size="15" font-weight="bold">Amazon Bedrock（クラウド・東京）</text>
<text class="sub" x="580" y="124" text-anchor="middle" font-size="12">モデルが考える＝「考えて」</text>
<text class="sub" x="580" y="148" text-anchor="middle" font-size="12">認証：Entra ID 連携</text>
<path class="arw" d="M335,100 L425,100"/>
<text class="acc" x="380" y="92" text-anchor="middle" font-size="12">考えて</text>
<path class="arw" d="M425,140 L335,140"/>
<text class="acc" x="380" y="160" text-anchor="middle" font-size="12">応答</text>
<text class="sub" x="380" y="215" text-anchor="middle" font-size="12">外部通信で明示的に不可なのは MCP外部連携のみ</text>
</svg>
