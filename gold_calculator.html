<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金買取概算計算ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'ヒラギノ角ゴ Pro', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #f5d547 0%, #ffd700 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .unit {
            color: #666;
            font-weight: 500;
            min-width: 30px;
        }

        .info-box {
            background: #f9f9f9;
            border-left: 4px solid #d4af37;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .result-section {
            background: linear-gradient(135deg, #fff9e6 0%, #fffef0 100%);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
        }

        .result-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .result-amount {
            font-size: 42px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 5px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 2px;
        }

        .result-yen {
            color: #333;
            font-size: 18px;
            font-weight: 500;
        }

        .calculation-details {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #888;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            font-weight: 500;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 金買取計算機</h1>
        <p class="subtitle">金の重量と純度から買取概算額を計算します</p>

        <div class="info-box">
            📍 グラム単価: <strong>9,000円/g</strong> (純金換算)
        </div>

        <form id="calculatorForm">
            <div class="form-group">
                <label for="weight">金の重量</label>
                <div class="input-wrapper">
                    <input
                        type="number"
                        id="weight"
                        placeholder="例: 10"
                        min="0"
                        step="0.1"
                        value="10"
                    >
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="form-group">
                <label for="purity">純度</label>
                <div class="input-wrapper">
                    <input
                        type="number"
                        id="purity"
                        placeholder="例: 75"
                        min="0"
                        max="100"
                        step="0.1"
                        value="75"
                    >
                    <span class="unit">%</span>
                </div>
            </div>
        </form>

        <div class="result-section">
            <div class="result-label">買取概算額</div>
            <div class="result-amount" id="resultAmount">67,500</div>
            <div class="result-yen">円</div>

            <div class="calculation-details">
                <div class="detail-row">
                    <span class="detail-label">純金の重量:</span>
                    <span class="detail-value" id="pureGoldWeight">7.5g</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">計算式:</span>
                    <span class="detail-value" id="formula">10g × 75% × 9,000円</span>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetForm()">リセット</button>

        <div class="footer">
            ⚠️ このツールは概算です。実際の買取価格とは異なる場合があります。
        </div>
    </div>

    <script>
        const PRICE_PER_GRAM = 9000; // 9,000円/g

        const weightInput = document.getElementById('weight');
        const purityInput = document.getElementById('purity');
        const resultAmount = document.getElementById('resultAmount');
        const pureGoldWeight = document.getElementById('pureGoldWeight');
        const formula = document.getElementById('formula');

        function calculate() {
            const weight = parseFloat(weightInput.value) || 0;
            const purity = parseFloat(purityInput.value) || 0;

            // 純金の重量を計算
            const pure = weight * (purity / 100);

            // 買取額を計算
            const amount = Math.round(pure * PRICE_PER_GRAM);

            // 表示を更新
            resultAmount.textContent = amount.toLocaleString('ja-JP');
            pureGoldWeight.textContent = (Math.round(pure * 100) / 100).toFixed(2) + 'g';
            formula.textContent = `${weight}g × ${purity}% × ${PRICE_PER_GRAM.toLocaleString('ja-JP')}円`;
        }

        function resetForm() {
            weightInput.value = '10';
            purityInput.value = '75';
            calculate();
        }

        // イベントリスナーを設定
        weightInput.addEventListener('input', calculate);
        purityInput.addEventListener('input', calculate);

        // 初期表示
        calculate();
    </script>
</body>
</html>
